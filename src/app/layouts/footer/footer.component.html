<footer class="bg-black text-white py-10">
  <div class="w-11/12 mx-auto">
    <h2 class="m-0 text-2xl">{{'footer.get_app' | translate}}</h2>
    <p class="text-sm">
{{'footer.app_description' | translate}}
    </p>

    <div class="flex items-center gap-3  mt-7 mb-10 text-nowrap">
      <input type="text" class="w-full rounded-lg py-[12px] border-gray-300 text-black" placeholder="Email" />
      <button class="btn-main p-3 rounded-lg  bg-[var(--primary-color)] hover:bg-[var(--hover-primary-color)] transition duration-500 ease-in-out">Share App
        {{'footer.shareLink' | translate}}
      </button>
    </div>

    <hr />

    <div class="pay-details md:flex justify-between items-center my-5">
      <div class="flex items-center gap-2">
        <h3 class="text-sm m-0">
          {{'footer.partners' | translate}}
        </h3>
        <img src="/images/amazon-pay.png" width="50px" alt="" />
        <img src="/images/American-Express-Color.png" width="50px" alt="" />
        <img src="/images/paypal.png" width="50px" alt="" />
        <img src="/images/mastercard.webp" width="50px" alt="" />
      </div>

      <div class="flex items-center gap-2">
        <h3 class="h6 m-0">{{'footer.getDeliveries' | translate}}</h3>
        <img src="/images/get-google-play.png" width="100px" alt="" />
        <img src="/images/get-apple-store.png" width="100px" alt="" />
      </div>
    </div>
    <!-- <hr /> -->
    <div class="flex items-center justify-around mt-5 ">
      <p class="text-sm">
{{'footer.copyright' | translate}}
      </p>
    </div>

  </div>
</footer>
