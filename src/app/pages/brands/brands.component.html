<section class="mb-20 px-4 md:px-14">

  <p class="text-[var(--primary-color)] text-lg font-bold main-text relative mb-5">
    {{'brands.ourBrands' | translate}}
  </p>


  <div class="grid grid-cols-1 sm:grid-cols-2  lg:grid-cols-4 gap-6">
    @for (brand of brands; track brand._id){

      <div class="bg-white p-4 rounded-xl shadow-lg flex flex-col items-center hover:scale-105 transition-transform ">
        <img [src]="brand.image" [alt]="brand.name" class="w-full h-[250px] object-contain" />
        <p class="text-center tracking-wide text-lg font-bold py-4 text-[var(--primary-color)] ">{{brand.name}}</p>
      </div>
    
    }
  </div>



</section>
